  <head>
    <meta charset="utf-8" />
    <style>
html, body {
    margin: 0;
    padding: 0;
}
#header {
    position: fixed;
    top: 0;
    left: 0;
    height: 50px;
    line-height: 50px;
    width: 100%;
    background-color: #999;
    box-shadow: 0px 0px 5px 0px rgba(0,0,0,0.5);
    font-family: Helvetica, sans-serif;
}
#header, #header a {
    color: white;
}
#downloads {
    float: right;
    background: #999;
}
.download {
    float: right;
    background: #999;
    padding: 0 5px;
}
.home {
  margin: 0;
  font-size: 125%;
  font-weight: lighter;
  text-transform: lowercase;
}
.home a {
  margin: 0;
  background: #666;
  padding-left: 25px;
  padding-right: 30px;
  margin-right: 20px;
  float: left;
  text-decoration: none;
}
.home:hover a {
  background: #555;
}
#audio {
    margin-top: 9px;
    width: 50%;
    display: inline-block;
}
#transcript {
    margin: 0 15px;
    margin-top: 70px;
    margin-bottom: 5em;
    white-space: pre-wrap;
    line-height: 2em;
    max-width: 600px;
    color: #999;
}
#transcript.status {
    background-color: #333;
    color: #fff;
    font-family: Courier, mono;
    line-height: 1em;
    font-size: 10pt;
    max-width: 100%;
}
#transcript.status h2 {
    padding: 10px;
}
#transcript.status .entry {
    margin-bottom: 10px;
    padding: 10px;
}
#transcript.status progress {
    width: 100%;
    height: 30px;
    margin-bottom: 20px;
}
.success {
    color: black;
}
.success:hover {
    text-decoration: underline;
}
.active {
    color: magenta;
}
#preloader {
    visibility: hidden;
}
.phactive {

}
.phones {
    position: absolute;
    color: #333;
}
.phones .phone {
    margin-right: 5px;

    font-size: 50%;
}

  margin-top: 100px;

  font-size: 8pt;
  font-style: italic;
  font-family: Helvetica, sans-serif;
  padding: 10px;

    <script>

function get(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onload = function() {
        cb(this.responseText);
    }
    xhr.send();
}
function get_json(url, cb) {
    get(url, function(x) {
        cb(JSON.parse(x));
    });
}

var $a = document.getElementById("audio");
window.onkeydown = function(ev) {
    if(ev.keyCode == 32) {
        ev.preventDefault();
        $a.pause();
    }
}

var $trans = document.getElementById("transcript");
var $preloader = document.getElementById('preloader');

var wds = [];
var cur_wd;

var $phones = document.createElement("div");
$phones.className = "phones";
document.body.appendChild($phones);

var cur_phones$ = [];           // List of phoneme $divs
var $active_phone;

function render_phones(wd) {
    cur_phones$ = [];
    $phones.innerHTML = "";
    $active_phone = null;

    $phones.style.top = wd.$div.offsetTop + 18;
    $phones.style.left = wd.$div.offsetLeft;

    var dur = wd.end - wd.start;

    var start_x = wd.$div.offsetLeft;
    
    wd.phones
        .forEach(function(ph){
            var $p = document.createElement("span");
            $p.className = "phone";
            $p.textContent = ph.phone.split("_")[0];
            
            $phones.appendChild($p);
            cur_phones$.push($p);
        });

    var offsetToCenter = (wd.$div.offsetWidth - $phones.offsetWidth) / 2;
    $phones.style.left = wd.$div.offsetLeft + offsetToCenter;
}
function highlight_phone(t) {
    if(!cur_wd) {
        $phones.innerHTML = "";
        return;
    }
    var hit;
    var cur_t = cur_wd.start;
    
    cur_wd.phones.forEach(function(ph, idx) {
        if(cur_t <= t && cur_t + ph.duration >= t) {
            hit = idx;
        }
        cur_t += ph.duration;
    });

    if(hit) {
        var $ph = cur_phones$[hit];
        if($ph != $active_phone) {
            if($active_phone) {
                $active_phone.classList.remove("phactive");
            }
            if($ph) {
                $ph.classList.add("phactive");
            }
        }
        $active_phone = $ph;
    }
}

function highlight_word() {
    var t = $a.currentTime;
    // XXX: O(N); use binary search
    var hits = wds.filter(function(x) {
        return (t - x.start) > 0.01 && (x.end - t) > 0.01;
    }, wds);
    var next_wd = hits[hits.length - 1];

    if(cur_wd != next_wd) {
        var active = document.querySelectorAll('.active');
        for(var i = 0; i < active.length; i++) {
            active[i].classList.remove('active');
        }
        if(next_wd && next_wd.$div) {
            next_wd.$div.classList.add('active');
            render_phones(next_wd);
        }
    }
    cur_wd = next_wd;
    highlight_phone(t);

    window.requestAnimationFrame(highlight_word);
}
window.requestAnimationFrame(highlight_word);

$trans.innerHTML = "Loading...";

function render(ret) {
    wds = ret['words'] || [];
    transcript = ret['transcript'];

    $trans.innerHTML = '';

    var currentOffset = 0;

    wds.forEach(function(wd) {
        if(wd.case == 'not-found-in-transcript') {
            // TODO: show phonemes somewhere
            var txt = ' ' + wd.word;
            var $plaintext = document.createTextNode(txt);
            $trans.appendChild($plaintext);
            return;
        }

        // Add non-linked text
        if(wd.startOffset > currentOffset) {
            var txt = transcript.slice(currentOffset, wd.startOffset);
            var $plaintext = document.createTextNode(txt);
            $trans.appendChild($plaintext);
            currentOffset = wd.startOffset;
        }

        var $wd = document.createElement('span');
        var txt = transcript.slice(wd.startOffset, wd.endOffset);
        var $wdText = document.createTextNode(txt);
        $wd.appendChild($wdText);
        wd.$div = $wd;
        if(wd.start !== undefined) {
            $wd.className = 'success';
        }
        $wd.onclick = function() {
            if(wd.start !== undefined) {
                console.log(wd.start);
                $a.currentTime = wd.start;
                $a.play();
            }
        };
        $trans.appendChild($wd);
        currentOffset = wd.endOffset;
    });

    var txt = transcript.slice(currentOffset, transcript.length);
    var $plaintext = document.createTextNode(txt);
    $trans.appendChild($plaintext);
    currentOffset = transcript.length;
}

function show_downloads() {
    var $d = document.getElementById("downloads");
    $d.textContent = "Download as: ";
    var uid = window.location.pathname.split("/")[2];
    // Name, path, title, inhibit-on-file:///
    [["CSV", "align.csv", "Word alignment CSV"],
     ["JSON", "align.json", "JSON word/phoneme alignment data"],
     ["Zip", "/zip/" + uid + ".zip", "Standalone zipfile", true]]
        .forEach(function(x) {
            var $a = document.createElement("a");
            $a.className = "download";
            $a.textContent = x[0];
            $a.href = x[1];
            $a.title = x[2];
            if(!x[3] || window.location.protocol != "file:") {
                $d.appendChild($a);
            }
        });
}

var status_init = false;
var status_log  = [];		// [ status ]
var $status_pro;

function render_status(ret) {
    if(!status_init) {
	// Clobber the $trans div and use it for status updates
	$trans.innerHTML = "<h2>transcription in progress</h2>";
	$trans.className = "status";
	$status_pro = document.createElement("progress");
	$status_pro.setAttribute("min", "0");
	$status_pro.setAttribute("max", "100");
	$status_pro.value = 0;
	$trans.appendChild($status_pro);
	
	status_init = true;
    }
    if(ret.status !== "TRANSCRIBING") {
	if(ret.percent) {
	    $status_pro.value = (100*ret.percent);
	}
    }
    else if(ret.percent && (status_log.length == 0 || status_log[status_log.length-1].percent+0.0001 < ret.percent)) {
	// New entry
	var $entry = document.createElement("div");
	$entry.className = "entry";
	$entry.textContent = ret.message;
	ret.$div = $entry;

	if(ret.percent) {
	    $status_pro.value = (100*ret.percent);
	}

	if(status_log.length > 0) {
	    $trans.insertBefore($entry, status_log[status_log.length-1].$div);
	}
	else {
	    $trans.appendChild($entry);
	}
	status_log.push(ret);
    }
}

function update() {
    if(INLINE_JSON) {
        // We want this to work from file:/// domains, so we provide a
        // mechanism for inlining the alignment data.
        render(INLINE_JSON);
        show_downloads();
    }
    else  {
	// Show the status
        get_json('status.json', function(ret) {
	    $a.style.visibility = 'hidden';
            if (ret.status == 'ERROR') {
                $preloader.style.visibility = 'hidden';
                $trans.innerHTML = '<b>' + ret.status + ': ' + ret.error + '</b>';
            } else if (ret.status == 'TRANSCRIBING' || ret.status == 'ALIGNING') {
                $preloader.style.visibility = 'visible';
                render_status(ret);
                setTimeout(update, 2000);
            } else if (ret.status == 'OK') {
                $preloader.style.visibility = 'hidden';
		// XXX: should we fetch the align.json?
		window.location.reload();
                show_downloads();
            } else if (ret.status == 'ENCODING' || ret.status == 'STARTED') {
                $preloader.style.visibility = 'visible';
                $trans.innerHTML = 'Encoding, please wait...';
                setTimeout(update, 2000);
            } else {
		console.log("unknown status", ret);
                $preloader.style.visibility = 'hidden';
                $trans.innerHTML = ret.status + '...';
                setTimeout(update, 5000);		
            }
        });
    }
}

var INLINE_JSON={
    "transcript": "When the Empire State Building Was New \r\nToday, New York's Empire State Building is one of the most famous structures in the world. It stands hundreds of feet taller than the skyscrapers that surround it, and is visible from far away in New Jersey and Long Island. But it isn't the tallest building in the world. In fact, since the recent completion of One World Trade Center, it isn't even the tallest building in New York City!\r\nBut when the Empire State Building was constructed, it was more than just another skyscraper. It was the tallest, most remarkable building on the earth\u2014and it stayed that way for close to forty years. To understand what people thought about the Empire State Building when it was first constructed, we can look at original newspaper reports from The New York Times. These are called primary sources, because they were written by people who witnessed history first-hand. With these New York Times reports, we can see the building through the eyes of the past, and perhaps have a chance to appreciate this most famous skyscraper as though it were new.\r\n* * *\r\nThe Empire State Building was built at the site of the famous Waldorf-Astoria Hotel, a lavish structure that, by 1929, was no longer up to the demands of the modern world. A corporation headed by former New York governor Alfred E. Smith proposed to build an office building there\u2014not just any office building, but the greatest in the world. At this time, there was fierce competition to see who could build the tallest building on the earth. The nearby Chrysler Building was set to claim the title, but Smith and his company wanted to steal it from them, by building something so big that it would be years before anyone could top it.\r\nThere was just one little problem: the Great Depression. The stock market crashed at the end of 1929, destroying banks, emptying savings accounts and leaving millions out of work. But the men behind the Empire State Building would not be stopped. They finished tearing down the old Waldorf-Astoria by the beginning of 1930, and on March 17\u2014St. Patrick's Day\u2014the work on the skyscraper began.\r\n\"Time was an essential element,\" wrote Smith, to complete \"the greatest structural accomplishment\" the city had ever seen.\r\nBecause height was of the utmost importance, the building was designed from the top down. At the very top would be a \"dirigible mooring mast.\" A dirigible is a kind of giant blimp, built to fly across the Atlantic Ocean in the days before jets. Although now that may seem silly, at the time, dirigibles were cutting edge technology, and the mooring mast, according to Smith, was \"a logical development of this day of air transportation.\" Moreover, the 200-foot mast would allow the building to solidly surpass the Chrysler Building in height.\r\nThe mooring mast was planned to reach nearly 1,300 feet above Fifth Avenue. Below that was the building\u2014as wide as a city block on the first floor, but narrower as it went up. The places where it got narrower are called \"setbacks,\" and they started at the sixth floor, a design the architects said, \"will save space and assure light and air to neighbors.\"\r\n\"We believe we have solved the problem of light and air in congested districts,\" said Mr. Smith.\r\nConstruction began on the bottom floors even before the designs for the top floors had been finalized. Once it started, it went fast. Times reporter C. G. Poore described the process as \"a chase up into the sky, with the steel workers going first and all the other trades following madly after them.\" To illustrate this, Poore produced \"some staggering figures\":\r\nThe building of the skyscraper represents an investment of $50,000,000 and all other figures are in proportion. More than 50,000 tons of steel, 10,000,000 bricks, and 200,000 cubic feet of stone will be used before the frame is completed. There will be seventy-five miles of water mains and 2,000,000 feet of electric light and power wiring...More than 3,000 men are daily at work...Among them are 225 carpenters, 290 bricklayers, 384 brick laborers, 328 arch laborers, 107 derrick men.\r\nEach day, those men walked to work past long unemployment lines, which reminded them how lucky they were to have such well-paying jobs. Building the Empire State Building was a dangerous job, performed without hardhats, harnesses, or any of the safety equipment required today. Imagine walking out on a narrow steel beam, 1,000 feet above the street, and then having to work up there all day!\r\nOn each floor, Poore tells us, there was \"a miniature railway system,\" to haul the steel, wood and marble brought up from street level. And to keep the men from having to go all the way down to eat lunch, there were \"restaurants at various levels of the building\" designed for the workers. At night, when the bosses went home, the workers could relax. They would pick a specific floor of the building and throw a party\u2014laughing and having fun, knowing that they were higher above the city than any of the richest men in town.\r\n* * *\r\nThe building was finished in just over a year. Of all the words written afterwards, perhaps the most interesting come from Mrs. Alice Liddell Hargreaves, an elderly English woman who visited the tower soon after its completion. Seventy years earlier, Mrs. Hargreaves had known a quiet country pastor named Lewis Carroll, who used her as the inspiration for his most famous book: Alice's Adventures in Wonderland. Now much older than the character she inspired, Mrs. Hargreaves \"seemed almost as excited with her newest adventures in the wonderland of New York.\"\r\nThe Empire State Building, she said, was \"just like the tumble down [the] rabbit hole.\"\r\n",
