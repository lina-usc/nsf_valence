  <head>
    <meta charset="utf-8" />
    <style>
html, body {
    margin: 0;
    padding: 0;
}
#header {
    position: fixed;
    top: 0;
    left: 0;
    height: 50px;
    line-height: 50px;
    width: 100%;
    background-color: #999;
    box-shadow: 0px 0px 5px 0px rgba(0,0,0,0.5);
    font-family: Helvetica, sans-serif;
}
#header, #header a {
    color: white;
}
#downloads {
    float: right;
    background: #999;
}
.download {
    float: right;
    background: #999;
    padding: 0 5px;
}
.home {
  margin: 0;
  font-size: 125%;
  font-weight: lighter;
  text-transform: lowercase;
}
.home a {
  margin: 0;
  background: #666;
  padding-left: 25px;
  padding-right: 30px;
  margin-right: 20px;
  float: left;

}
.home:hover a {
  background: #555;
}
#audio {
    margin-top: 9px;
    width: 50%;
    display: inline-block;
}
#transcript {
    margin: 0 15px;
    margin-top: 70px;
    margin-bottom: 5em;
    white-space: pre-wrap;
    line-height: 2em;
    max-width: 600px;
    color: #999;
}
#transcript.status {
    background-color: #333;
    color: #fff;
    font-family: Courier, mono;
    line-height: 1em;
    font-size: 10pt;
    max-width: 100%;
}
#transcript.status h2 {
    padding: 10px;
}
#transcript.status .entry {
    margin-bottom: 10px;
    padding: 10px;
}
#transcript.status progress {
    width: 100%;
    height: 30px;
    margin-bottom: 20px;
}
.success {
    color: black;
}
.success:hover {
    text-decoration: underline;
}
.active {
    color: magenta;
}
#preloader {
    visibility: hidden;
}
.phactive {
    text-decoration: underline;
}
.phones {
    position: absolute;
    color: #333;
}
.phones .phone {
    margin-right: 5px;

    font-size: 50%;
}
.phones .phone:last-child {
    margin-right: 0;

  margin-top: 100px;

  font-size: 8pt;

    <script>

function get(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onload = function() {
        cb(this.responseText);
    }
    xhr.send();
}
function get_json(url, cb) {
    get(url, function(x) {
        cb(JSON.parse(x));
    });
}

var $a = document.getElementById("audio");
window.onkeydown = function(ev) {
    if(ev.keyCode == 32) {
        ev.preventDefault();
        $a.pause();
    }
}

var $trans = document.getElementById("transcript");
var $preloader = document.getElementById('preloader');

var wds = [];
var cur_wd;

var $phones = document.createElement("div");
$phones.className = "phones";
document.body.appendChild($phones);

var cur_phones$ = [];           // List of phoneme $divs
var $active_phone;

function render_phones(wd) {
    cur_phones$ = [];
    $phones.innerHTML = "";
    $active_phone = null;

    $phones.style.top = wd.$div.offsetTop + 18;
    $phones.style.left = wd.$div.offsetLeft;

    var dur = wd.end - wd.start;

    var start_x = wd.$div.offsetLeft;
    
    wd.phones
        .forEach(function(ph){
            var $p = document.createElement("span");
            $p.className = "phone";
            $p.textContent = ph.phone.split("_")[0];
            
            $phones.appendChild($p);
            cur_phones$.push($p);
        });

    var offsetToCenter = (wd.$div.offsetWidth - $phones.offsetWidth) / 2;
    $phones.style.left = wd.$div.offsetLeft + offsetToCenter;
}
function highlight_phone(t) {
    if(!cur_wd) {
        $phones.innerHTML = "";
        return;
    }
    var hit;
    var cur_t = cur_wd.start;
    
    cur_wd.phones.forEach(function(ph, idx) {
        if(cur_t <= t && cur_t + ph.duration >= t) {
            hit = idx;
        }
        cur_t += ph.duration;
    });

    if(hit) {
        var $ph = cur_phones$[hit];
        if($ph != $active_phone) {
            if($active_phone) {
                $active_phone.classList.remove("phactive");
            }
            if($ph) {
                $ph.classList.add("phactive");
            }
        }
        $active_phone = $ph;
    }
}

function highlight_word() {
    var t = $a.currentTime;
    // XXX: O(N); use binary search
    var hits = wds.filter(function(x) {
        return (t - x.start) > 0.01 && (x.end - t) > 0.01;
    }, wds);
    var next_wd = hits[hits.length - 1];

    if(cur_wd != next_wd) {
        var active = document.querySelectorAll('.active');
        for(var i = 0; i < active.length; i++) {
            active[i].classList.remove('active');
        }
        if(next_wd && next_wd.$div) {
            next_wd.$div.classList.add('active');
            render_phones(next_wd);
        }
    }
    cur_wd = next_wd;
    highlight_phone(t);

    window.requestAnimationFrame(highlight_word);
}
window.requestAnimationFrame(highlight_word);

$trans.innerHTML = "Loading...";

function render(ret) {
    wds = ret['words'] || [];
    transcript = ret['transcript'];

    $trans.innerHTML = '';

    var currentOffset = 0;

    wds.forEach(function(wd) {
        if(wd.case == 'not-found-in-transcript') {
            // TODO: show phonemes somewhere
            var txt = ' ' + wd.word;
            var $plaintext = document.createTextNode(txt);
            $trans.appendChild($plaintext);
            return;
        }

        // Add non-linked text
        if(wd.startOffset > currentOffset) {
            var txt = transcript.slice(currentOffset, wd.startOffset);
            var $plaintext = document.createTextNode(txt);
            $trans.appendChild($plaintext);
            currentOffset = wd.startOffset;
        }

        var $wd = document.createElement('span');
        var txt = transcript.slice(wd.startOffset, wd.endOffset);
        var $wdText = document.createTextNode(txt);
        $wd.appendChild($wdText);
        wd.$div = $wd;
        if(wd.start !== undefined) {
            $wd.className = 'success';
        }
        $wd.onclick = function() {
            if(wd.start !== undefined) {
                console.log(wd.start);
                $a.currentTime = wd.start;
                $a.play();
            }
        };
        $trans.appendChild($wd);
        currentOffset = wd.endOffset;
    });

    var txt = transcript.slice(currentOffset, transcript.length);
    var $plaintext = document.createTextNode(txt);
    $trans.appendChild($plaintext);
    currentOffset = transcript.length;
}

function show_downloads() {
    var $d = document.getElementById("downloads");
    $d.textContent = "Download as: ";
    var uid = window.location.pathname.split("/")[2];
    // Name, path, title, inhibit-on-file:///
    [["CSV", "align.csv", "Word alignment CSV"],
     ["JSON", "align.json", "JSON word/phoneme alignment data"],
     ["Zip", "/zip/" + uid + ".zip", "Standalone zipfile", true]]
        .forEach(function(x) {
            var $a = document.createElement("a");
            $a.className = "download";
            $a.textContent = x[0];
            $a.href = x[1];
            $a.title = x[2];
            if(!x[3] || window.location.protocol != "file:") {
                $d.appendChild($a);
            }
        });
}

var status_init = false;
var status_log  = [];		// [ status ]
var $status_pro;

function render_status(ret) {
    if(!status_init) {
	// Clobber the $trans div and use it for status updates
	$trans.innerHTML = "<h2>transcription in progress</h2>";
	$trans.className = "status";
	$status_pro = document.createElement("progress");
	$status_pro.setAttribute("min", "0");
	$status_pro.setAttribute("max", "100");
	$status_pro.value = 0;
	$trans.appendChild($status_pro);
	
	status_init = true;
    }
    if(ret.status !== "TRANSCRIBING") {
	if(ret.percent) {
	    $status_pro.value = (100*ret.percent);
	}
    }
    else if(ret.percent && (status_log.length == 0 || status_log[status_log.length-1].percent+0.0001 < ret.percent)) {
	// New entry
	var $entry = document.createElement("div");
	$entry.className = "entry";
	$entry.textContent = ret.message;
	ret.$div = $entry;

	if(ret.percent) {
	    $status_pro.value = (100*ret.percent);
	}

	if(status_log.length > 0) {
	    $trans.insertBefore($entry, status_log[status_log.length-1].$div);
	}
	else {
	    $trans.appendChild($entry);
	}
	status_log.push(ret);
    }
}

function update() {
    if(INLINE_JSON) {
        // We want this to work from file:/// domains, so we provide a
        // mechanism for inlining the alignment data.
        render(INLINE_JSON);
        show_downloads();
    }
    else  {
	// Show the status
        get_json('status.json', function(ret) {
	    $a.style.visibility = 'hidden';
            if (ret.status == 'ERROR') {
                $preloader.style.visibility = 'hidden';
                $trans.innerHTML = '<b>' + ret.status + ': ' + ret.error + '</b>';
            } else if (ret.status == 'TRANSCRIBING' || ret.status == 'ALIGNING') {
                $preloader.style.visibility = 'visible';
                render_status(ret);
                setTimeout(update, 2000);
            } else if (ret.status == 'OK') {
                $preloader.style.visibility = 'hidden';
		// XXX: should we fetch the align.json?
		window.location.reload();
                show_downloads();
            } else if (ret.status == 'ENCODING' || ret.status == 'STARTED') {
                $preloader.style.visibility = 'visible';
                $trans.innerHTML = 'Encoding, please wait...';
                setTimeout(update, 2000);
            } else {
		console.log("unknown status", ret);
                $preloader.style.visibility = 'hidden';
                $trans.innerHTML = ret.status + '...';
                setTimeout(update, 5000);		
            }
        });
    }
}

d parking, and cycled over to meet her.  Since we don\u2019t get to see each other very often we always appreciate the time we do spend together and try to make the best of whatever time we do have.  So, we went off on our bikes and rode towards the bike path quickly after greeting each other, no time to waste!  We biked and biked all afternoon long until we noticed the sun was starting to go down.  We must have ridden something like ten miles or more.  And trust me when I say, we were feeling it in every muscle, every bone, every inch of our legs was so sore, but it was worth it because we had such a great time.  No longer able to stand without shaking like we were experiencing our own personal earthquakes, we decided to sit on the grass while we threw pieces of stale bread in the water towards the feathery ducks and little ducklings.  We sat there throwing and chatting and laughing for quite a while until suddenly, we realized it was already dark and we probably needed to head home soon. We said our goodbyes and per our usual ritual, hugged and promised to call and make plans again soon.  Our time seemed so limited these days and we didn\u2019t want to let the important things slip through the cracks.  Driving back to my house I could just catch the last little edge of the sunset in my rearview mirror; the swirl of oranges and pinks darkening and turning blue and black to let the moon shine through.  I stopped at a popular neighborhood take-out place to grab dinner because it\u2019s my husband\u2019s favorite, and the owner surprised me with complimentary appetizers. The delicious aroma filled the car the rest of the way home. When I arrived, my husband was already there to greet me. Over dinner, we chatted about our days. He told me that since he came on a Saturday he gets to take a Friday off. I told him all about my day at the park and how we completely lost track of time but didn\u2019t mind because it was so fun.  I also showed him adorable pictures of the ducklings and some funny ones of a particularly clumsy duckling that didn\u2019t seem to notice where the dock ended and tumbled right off the edge.  Comfortable on the couch, we snacked on some popcorn and picked out a movie to watch.  As usual none of the new movie suggestions were piquing our interest so we decided to watch an old favorite.  I\u2019m not sure if we were both tired from active days or just not paying attention since we\u2019d seen the movie before, but we both fell asleep about an hour into the movie.  Either way, not a bad way to end a fantastic day.  I can\u2019t wait for another day like that.",
