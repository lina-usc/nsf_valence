  <head>
    <meta charset="utf-8" />
    <style>
html, body {
    margin: 0;
    padding: 0;
}
#header {
    position: fixed;
    top: 0;
    left: 0;
    height: 50px;
    line-height: 50px;
    width: 100%;
    background-color: #999;
    box-shadow: 0px 0px 5px 0px rgba(0,0,0,0.5);
    font-family: Helvetica, sans-serif;
}
#header, #header a {
    color: white;
}
#downloads {
    float: right;
    background: #999;
}
.download {
    float: right;
    background: #999;
    padding: 0 5px;
}
.home {
  margin: 0;
  font-size: 125%;
  font-weight: lighter;
  text-transform: lowercase;
}
.home a {
  margin: 0;
  background: #666;
  padding-left: 25px;
  padding-right: 30px;
  margin-right: 20px;
  float: left;
  text-decoration: none;
}
.home:hover a {
  background: #555;
}
#audio {
    margin-top: 9px;
    width: 50%;
    display: inline-block;
}
#transcript {
    margin: 0 15px;
    margin-top: 70px;
    margin-bottom: 5em;
    white-space: pre-wrap;
    line-height: 2em;
    max-width: 600px;
    color: #999;
}
#transcript.status {
    background-color: #333;
    color: #fff;
    font-family: Courier, mono;
    line-height: 1em;
    font-size: 10pt;
    max-width: 100%;
}
#transcript.status h2 {
    padding: 10px;
}
#transcript.status .entry {
    margin-bottom: 10px;
    padding: 10px;
}
#transcript.status progress {
    width: 100%;
    height: 30px;
    margin-bottom: 20px;
}
.success {
    color: black;
}
.success:hover {
    text-decoration: underline;
}
.active {
    color: magenta;
}
#preloader {
    visibility: hidden;
}
.phactive {
    text-decoration: underline;
}
.phones {
    position: absolute;
    color: #333;
}
.phones .phone {
    margin-right: 5px;
    font-family: Helvetica, sans-serif;
    text-transform: uppercase;
    font-size: 50%;
}
.phones .phone:last-child {
    margin-right: 0;
}
#footer {
  margin-top: 100px;
  border-top: 1px dotted black;
  font-size: 8pt;
  font-style: italic;
  font-family: Helvetica, sans-serif;
  padding: 10px;
}

    <script>

function get(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onload = function() {
        cb(this.responseText);
    }
    xhr.send();
}
function get_json(url, cb) {
    get(url, function(x) {
        cb(JSON.parse(x));
    });
}

var $a = document.getElementById("audio");
window.onkeydown = function(ev) {
    if(ev.keyCode == 32) {
        ev.preventDefault();
        $a.pause();
    }
}

var $trans = document.getElementById("transcript");
var $preloader = document.getElementById('preloader');

var wds = [];
var cur_wd;

var $phones = document.createElement("div");
$phones.className = "phones";
document.body.appendChild($phones);

var cur_phones$ = [];           // List of phoneme $divs
var $active_phone;

function render_phones(wd) {
    cur_phones$ = [];
    $phones.innerHTML = "";
    $active_phone = null;

    $phones.style.top = wd.$div.offsetTop + 18;
    $phones.style.left = wd.$div.offsetLeft;

    var dur = wd.end - wd.start;

    var start_x = wd.$div.offsetLeft;
    
    wd.phones
        .forEach(function(ph){
            var $p = document.createElement("span");
            $p.className = "phone";
            $p.textContent = ph.phone.split("_")[0];
            
            $phones.appendChild($p);
            cur_phones$.push($p);
        });

    var offsetToCenter = (wd.$div.offsetWidth - $phones.offsetWidth) / 2;
    $phones.style.left = wd.$div.offsetLeft + offsetToCenter;
}
function highlight_phone(t) {
    if(!cur_wd) {
        $phones.innerHTML = "";
        return;
    }
    var hit;
    var cur_t = cur_wd.start;
    
    cur_wd.phones.forEach(function(ph, idx) {
        if(cur_t <= t && cur_t + ph.duration >= t) {
            hit = idx;
        }
        cur_t += ph.duration;
    });

    if(hit) {
        var $ph = cur_phones$[hit];
        if($ph != $active_phone) {
            if($active_phone) {
                $active_phone.classList.remove("phactive");
            }
            if($ph) {
                $ph.classList.add("phactive");
            }
        }
        $active_phone = $ph;
    }
}

function highlight_word() {
    var t = $a.currentTime;
    // XXX: O(N); use binary search
    var hits = wds.filter(function(x) {
        return (t - x.start) > 0.01 && (x.end - t) > 0.01;
    }, wds);
    var next_wd = hits[hits.length - 1];

    if(cur_wd != next_wd) {
        var active = document.querySelectorAll('.active');
        for(var i = 0; i < active.length; i++) {
            active[i].classList.remove('active');
        }
        if(next_wd && next_wd.$div) {
            next_wd.$div.classList.add('active');
            render_phones(next_wd);
        }
    }
    cur_wd = next_wd;
    highlight_phone(t);

    window.requestAnimationFrame(highlight_word);
}
window.requestAnimationFrame(highlight_word);

$trans.innerHTML = "Loading...";

function render(ret) {
    wds = ret['words'] || [];
    transcript = ret['transcript'];

    $trans.innerHTML = '';

    var currentOffset = 0;

    wds.forEach(function(wd) {
        if(wd.case == 'not-found-in-transcript') {
            // TODO: show phonemes somewhere
            var txt = ' ' + wd.word;
            var $plaintext = document.createTextNode(txt);
            $trans.appendChild($plaintext);
            return;
        }

        // Add non-linked text
        if(wd.startOffset > currentOffset) {
            var txt = transcript.slice(currentOffset, wd.startOffset);
            var $plaintext = document.createTextNode(txt);
            $trans.appendChild($plaintext);
            currentOffset = wd.startOffset;
        }

        var $wd = document.createElement('span');
        var txt = transcript.slice(wd.startOffset, wd.endOffset);
        var $wdText = document.createTextNode(txt);
        $wd.appendChild($wdText);
        wd.$div = $wd;
        if(wd.start !== undefined) {
            $wd.className = 'success';
        }
        $wd.onclick = function() {
            if(wd.start !== undefined) {
                console.log(wd.start);
                $a.currentTime = wd.start;
                $a.play();
            }
        };
        $trans.appendChild($wd);
        currentOffset = wd.endOffset;
    });

    var txt = transcript.slice(currentOffset, transcript.length);
    var $plaintext = document.createTextNode(txt);
    $trans.appendChild($plaintext);
    currentOffset = transcript.length;
}

function show_downloads() {
    var $d = document.getElementById("downloads");
    $d.textContent = "Download as: ";
    var uid = window.location.pathname.split("/")[2];
    // Name, path, title, inhibit-on-file:///
    [["CSV", "align.csv", "Word alignment CSV"],
     ["JSON", "align.json", "JSON word/phoneme alignment data"],
     ["Zip", "/zip/" + uid + ".zip", "Standalone zipfile", true]]
        .forEach(function(x) {
            var $a = document.createElement("a");
            $a.className = "download";
            $a.textContent = x[0];
            $a.href = x[1];
            $a.title = x[2];
            if(!x[3] || window.location.protocol != "file:") {
                $d.appendChild($a);
            }
        });
}

var status_init = false;
var status_log  = [];		// [ status ]
var $status_pro;

function render_status(ret) {
    if(!status_init) {
	// Clobber the $trans div and use it for status updates
	$trans.innerHTML = "<h2>transcription in progress</h2>";
	$trans.className = "status";
	$status_pro = document.createElement("progress");
	$status_pro.setAttribute("min", "0");
	$status_pro.setAttribute("max", "100");
	$status_pro.value = 0;
	$trans.appendChild($status_pro);
	
	status_init = true;
    }
    if(ret.status !== "TRANSCRIBING") {
	if(ret.percent) {
	    $status_pro.value = (100*ret.percent);
	}
    }
    else if(ret.percent && (status_log.length == 0 || status_log[status_log.length-1].percent+0.0001 < ret.percent)) {
	// New entry
	var $entry = document.createElement("div");
	$entry.className = "entry";
	$entry.textContent = ret.message;
	ret.$div = $entry;

	if(ret.percent) {
	    $status_pro.value = (100*ret.percent);
	}

	if(status_log.length > 0) {
	    $trans.insertBefore($entry, status_log[status_log.length-1].$div);
	}
	else {
	    $trans.appendChild($entry);
	}
	status_log.push(ret);
    }
}

function update() {
    if(INLINE_JSON) {
        // We want this to work from file:/// domains, so we provide a
        // mechanism for inlining the alignment data.
        render(INLINE_JSON);
        show_downloads();
    }
    else  {
	// Show the status
        get_json('status.json', function(ret) {
	    $a.style.visibility = 'hidden';
            if (ret.status == 'ERROR') {
                $preloader.style.visibility = 'hidden';
                $trans.innerHTML = '<b>' + ret.status + ': ' + ret.error + '</b>';
            } else if (ret.status == 'TRANSCRIBING' || ret.status == 'ALIGNING') {
                $preloader.style.visibility = 'visible';
                render_status(ret);
                setTimeout(update, 2000);
            } else if (ret.status == 'OK') {
                $preloader.style.visibility = 'hidden';
		// XXX: should we fetch the align.json?
		window.location.reload();
                show_downloads();
            } else if (ret.status == 'ENCODING' || ret.status == 'STARTED') {
                $preloader.style.visibility = 'visible';
                $trans.innerHTML = 'Encoding, please wait...';
                setTimeout(update, 2000);
            } else {
		console.log("unknown status", ret);
                $preloader.style.visibility = 'hidden';
                $trans.innerHTML = ret.status + '...';
                setTimeout(update, 5000);		
            }
        });
    }
}

ng for,\"\r\nanswered the Tiger. \"What I'm hungry for is fat babies. I\r\nhave a great desire to eat a few fat babies. Then, perhaps, the\r\npeople of Oz would fear me and I'd become more\r\nimportant.\"\r\n\"True,\" agreed the Lion. \"It would stir up quite a scene if you\r\nate but one fat baby. As for myself, my claws are sharp as\r\nneedles and strong as crowbars. My teeth are powerful\r\nenough to tear a person to pieces in a few seconds. I could\r\nspring upon a man and make chop suey of him. There would\r\nbe wild excitement in the Emerald City. People would fall\r\nupon their knees and beg me for mercy. That, in my opinion,\r\nwould render me very important.\"\r\n\"After you had torn the person to pieces, what would you do\r\nnext?\" asked the Tiger sleepily.\r\n\r\n\"Then I would roar so loudly it would shake the earth and\r\nstalk away to the jungle to hide myself, before anyone could\r\nattack me or kill me for what I had done.\"\r\n\"I see,\" nodded the Tiger. \"You are really cowardly.\"\r\n\"To be sure. That is why I am named the Cowardly Lion.\r\nThat is why I have always been so tame and peaceable. But\r\nI'm awfully tired of being tame,\" added the Lion, with a sigh,\r\n\"and it would be fun to raise a row and show people what a\r\nterrible beast I really am.\"\r\nThe Tiger remained silent for several minutes, thinking\r\ndeeply as he slowly washed his face with his left paw. Then\r\nhe said:\r\n\"I'm getting old, and it would please me to eat at least one fat\r\nbaby before I die. Suppose we surprise these people of Oz\r\nand prove our power. What do you say? We will walk out of\r\nhere just as usual and the first baby we meet I'll eat in a\r\njiffy. And the first man or woman you meet, you will tear to\r\npieces. Then we will both run out of the city gates and gallop\r\nacross the country and hide in the jungle before anyone can\r\nstop us.\"\r\n\"All right. I'm game,\" said the Lion, yawning again so that\r\nhe showed two rows of large sharp teeth.\r\nThe Tiger got up and stretched his great, sleek body.\r\n\"Seen any of them old Hydrophobies the last day or two?\"\r\n\"Come on,\" he said. The Lion stood up and proved he was\r\nthe larger of the two, for he was almost as big as a small\r\nhorse.\r\nOut of the palace they walked, and met no one. They passed\r\nthrough the beautiful grounds, past fountains and beds of\r\nlovely flowers, and met no one. Then they unlatched a gate\r\nand entered a street of the city, and met no one.\r\n\"I wonder how a fat baby will taste,\" said the Tiger, as they\r\nstalked majestically along, side by side.\r\n\"I imagine it will taste like nutmegs,\" said the Lion.\r\n\"No,\" said the Tiger, \"I've an idea it will taste like\r\ngumdrops.\"\r\nThey turned a corner, but met no one, for the people of the\r\nEmerald City usually take their naps at this hour of the\r\nafternoon.\r\n \"I wonder how many pieces I ought to tear a person into,\"\r\nsaid the Lion, in a thoughtful voice.\r\n\"Sixty would be about right,\" suggested the Tiger.\r\n\"Would that hurt any more than to tear one into about a\r\ndozen pieces?\" asked the Lion, with a little shudder.\r\n\"Who cares whether it hurts or not?\" growled the Tiger.\r\nThe Lion did not reply. \r\nThey entered a side street, but met no\r\none. Suddenly they heard a child crying.\r\n\"Aha!\" exclaimed the Tiger. \"There is my meat.\"\r\nHe rushed around a corner, the Lion following, and came\r\nupon a nice fat baby sitting in the middle of the street and\r\ncrying as if in great distress.\r\n\"What's the matter?\" asked the Tiger, crouching before the\r\nbaby.\r\n\"I--I--I-lost my m-m-mamma!\" wailed the baby.\r\n\"Why, you poor little thing,\" said the great beast, softly\r\nstroking the child's head with its paw. \"Don't cry, my dear,\r\nfor mamma can't be far away. I'll help you find her.\"\r\n",
